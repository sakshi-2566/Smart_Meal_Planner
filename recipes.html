<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management - Smart Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="recipes.css">
</head>
<body>
    <!-- Navigation will be loaded by navbar.js -->
    <script src="navbar.js"></script>
    <script>loadNavbar('recipes');</script>

    <div class="container my-5">
        <!-- Header -->
        <div class="mb-4">
            <h1><i class="fas fa-book-open"></i> Recipe Management</h1>
            <div id="filterInfo" class="text-muted small" style="display: none;">
                <i class="fas fa-info-circle"></i> <span id="filterInfoText"></span>
            </div>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <select class="form-select" id="filterType">
                            <option value="approved" selected>Approved Recipes</option>
                            <option value="my">My Recipes</option>
                            <option value="ai_generated">AI Generated Recipes</option>
                            <option value="all">All Recipes</option>
                            <option value="public">Public Recipes</option>
                            <option value="pending" id="pendingOption" style="display:none;">Pending Approval</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search recipes...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="dietaryFilter">
                            <option value="">All Dietary Tags</option>
                            <option value="vegetarian">Vegetarian</option>
                            <option value="vegan">Vegan</option>
                            <option value="gluten-free">Gluten Free</option>
                            <option value="keto">Keto</option>
                            <option value="high-protein">High Protein</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" id="applyFilters">
                            <i class="fas fa-filter"></i> Apply Filters
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recipes Grid -->
        <div id="recipesContainer" class="row g-4">
            <!-- Recipes will be loaded here -->
        </div>

        <!-- Pagination -->
        <nav aria-label="Recipe pagination" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>

    <!-- Add/Edit Recipe Modal -->
    <div class="modal fade" id="addRecipeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Recipe</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="recipeForm">
                        <input type="hidden" id="recipeId">
                        
                        <!-- Basic Info -->
                        <div class="mb-3">
                            <label class="form-label">Recipe Name *</label>
                            <input type="text" class="form-control" id="recipeName" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="recipeDescription" rows="3"></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Prep Time (min)</label>
                                <input type="number" class="form-control" id="prepTime" min="0">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Cook Time (min)</label>
                                <input type="number" class="form-control" id="cookTime" min="0">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Servings</label>
                                <input type="number" class="form-control" id="servings" min="1" value="1">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" id="imageUrl">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Dietary Tags</label>
                            <input type="text" class="form-control" id="dietaryTags" 
                                   placeholder="e.g., vegetarian, gluten-free, keto">
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="isPublic">
                            <label class="form-check-label" for="isPublic">Make recipe public</label>
                        </div>
                        
                        <!-- Ingredients -->
                        <h6 class="mt-4">Ingredients *</h6>
                        <div id="ingredientsContainer">
                            <div class="ingredient-row mb-2">
                                <div class="row">
                                    <div class="col-md-5">
                                        <select class="form-select ingredient-select" required>
                                            <option value="">Select ingredient...</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <input type="number" class="form-control ingredient-quantity" 
                                               placeholder="Quantity" step="0.01" required>
                                    </div>
                                    <div class="col-md-3">
                                        <input type="text" class="form-control ingredient-unit" 
                                               placeholder="Unit" value="g">
                                    </div>
                                    <div class="col-md-1">
                                        <button type="button" class="btn btn-danger btn-sm remove-ingredient">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-success" id="addIngredient">
                            <i class="fas fa-plus"></i> Add Ingredient
                        </button>
                        
                        <!-- Steps -->
                        <h6 class="mt-4">Cooking Steps *</h6>
                        <div id="stepsContainer">
                            <div class="step-row mb-2">
                                <div class="input-group">
                                    <span class="input-group-text">1</span>
                                    <textarea class="form-control step-description" rows="2" 
                                              placeholder="Describe this step..." required></textarea>
                                    <button type="button" class="btn btn-danger remove-step">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-success" id="addStep">
                            <i class="fas fa-plus"></i> Add Step
                        </button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="saveRecipe">Save Recipe</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Recipe Modal -->
    <div class="modal fade" id="viewRecipeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewRecipeName"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewRecipeContent">
                    <!-- Recipe details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="recipes.js"></script>
</body>
</html>
