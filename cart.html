<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Smart Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Navigation will be loaded by navbar.js -->
    <script src="navbar.js"></script>
    <script>loadNavbar('cart');</script>

    <div class="container my-5">
        <div class="row">
            <!-- Cart Items -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="fas fa-shopping-cart"></i> Shopping Cart</h4>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearCart()">
                            <i class="fas fa-trash"></i> Clear Cart
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="cartItems">
                            <div class="text-center py-5">
                                <div class="spinner-border text-success" role="status"></div>
                                <p class="mt-3">Loading cart...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-receipt"></i> Order Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Items:</span>
                            <strong id="totalItems">0</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal:</span>
                            <strong id="subtotal">₹0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Delivery:</span>
                            <strong id="delivery">₹20.00</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-3">
                            <strong>Total:</strong>
                            <strong class="text-success" id="total">₹0.00</strong>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0">Delivery Address</label>
                                <button class="btn btn-sm btn-outline-primary" style="font-size: 0.8rem;"
                                    onclick="fetchAddress()">
                                    <i class="fas fa-map-marker-alt"></i> Use My Location
                                </button>
                            </div>
                            <textarea class="form-control" id="deliveryAddress" rows="3"
                                placeholder="Enter your delivery address or click 'Use My Location'"></textarea>
                        </div>

                        <button class="btn btn-success w-100" onclick="checkout()" id="checkoutBtn">
                            <i class="fas fa-check"></i> Proceed to Checkout
                        </button>

                        <button class="btn btn-outline-primary w-100 mt-2" onclick="continueShopping()">
                            <i class="fas fa-arrow-left"></i> Continue Shopping
                        </button>
                    </div>
                </div>

                <!-- Quick Info -->
                <div class="card mt-3">
                    <div class="card-body">
                        <h6><i class="fas fa-info-circle text-info"></i> Delivery Info</h6>
                        <ul class="small mb-0">
                            <li>Free delivery on orders over ₹200</li>
                            <li>Estimated delivery: 2-3 business days</li>
                            <li>Fresh ingredients guaranteed</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cart.js"></script>
</body>

</html>
