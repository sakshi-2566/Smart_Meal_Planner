<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chicken Fix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .veg-badge { background-color: #28a745 !important; }
        .non-veg-badge { background-color: #dc3545 !important; }
        .ingredient-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h2>🧪 Testing Chicken Vegetarian Fix</h2>
        <p class="text-muted">This page tests if chicken ingredients now show NON-VEG badge correctly.</p>
        
        <div class="alert alert-info">
            <strong>Expected Result:</strong> All chicken-related ingredients should show <span class="badge bg-danger">NON-VEG</span> badge.
        </div>
        
        <div id="testResults">
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Testing chicken ingredients...</p>
            </div>
        </div>
        
        <div class="mt-4">
            <button class="btn btn-primary" onclick="runTest()">🔄 Run Test Again</button>
            <button class="btn btn-success" onclick="window.location.href='inventory.html'">📦 Go to Inventory</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', runTest);
        
        function runTest() {
            document.getElementById('testResults').innerHTML = `
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Testing chicken ingredients...</p>
                </div>
            `;
            
            // Test the API endpoint
            fetch('api/get_ingredients.php', {
                credentials: 'include'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const chickenIngredients = data.ingredients.filter(ing => 
                        ing.ingredient_name.toLowerCase().includes('chicken')
                    );
                    
                    displayTestResults(chickenIngredients);
                } else {
                    document.getElementById('testResults').innerHTML = `
                        <div class="alert alert-danger">
                            <strong>Error:</strong> ${data.message || 'Failed to load ingredients'}
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('testResults').innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            });
        }
        
        function displayTestResults(chickenIngredients) {
            const container = document.getElementById('testResults');
            
            if (chickenIngredients.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-warning">
                        <strong>No chicken ingredients found in database.</strong>
                    </div>
                `;
                return;
            }
            
            let allCorrect = true;
            const results = chickenIngredients.map(ing => {
                const isVegetarian = Boolean(Number(ing.is_vegetarian));
                const isCorrect = !isVegetarian; // Chicken should be non-vegetarian
                if (isCorrect === false) allCorrect = false;
                
                return `
                    <div class="ingredient-card ${isCorrect ? 'border-success' : 'border-danger'}">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-1">${ing.ingredient_name}</h6>
                                <small class="text-muted">ID: ${ing.id} | Category: ${ing.category}</small>
                            </div>
                            <div>
                                ${isVegetarian ? 
                                    '<span class="badge bg-success veg-badge"><i class="fas fa-leaf"></i> VEG</span>' : 
                                    '<span class="badge bg-danger non-veg-badge"><i class="fas fa-drumstick-bite"></i> NON-VEG</span>'
                                }
                                ${isCorrect ? 
                                    '<i class="fas fa-check-circle text-success ms-2" title="Correct"></i>' :
                                    '<i class="fas fa-times-circle text-danger ms-2" title="Incorrect - should be NON-VEG"></i>'
                                }
                            </div>
                        </div>
                        <div class="mt-2">
                            <small class="text-muted">
                                Database value: is_vegetarian = ${ing.is_vegetarian} 
                                (${isVegetarian ? 'VEG' : 'NON-VEG'})
                            </small>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = `
                <div class="alert alert-${allCorrect ? 'success' : 'danger'}">
                    <strong>${allCorrect ? '✅ Test PASSED' : '❌ Test FAILED'}:</strong> 
                    ${allCorrect ? 
                        'All chicken ingredients correctly show NON-VEG badge!' :
                        'Some chicken ingredients still show VEG badge. Database may need another update.'
                    }
                </div>
                <h5>Chicken Ingredients Found (${chickenIngredients.length}):</h5>
                ${results}
            `;
        }
    </script>
</body>
</html>
